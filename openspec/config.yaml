schema: spec-driven

# OpenSpec CLI 注入：完整工程约束见 openspec/project.md；Cursor / 其它 AI 环境见根 AGENTS.md。
context: |
  工程约束与 OpenSpec 约定全文见 openspec/project.md；编写制品或实现代码前 MUST 阅读并对照。
  当前合并基线：openspec/specs/v2.1.0.md。
  OpenSpec 制品须简体中文；每条 ### Requirement 正文须含英文 SHALL 或 MUST。

# PR / 归档 / 应用变更前人工评审（细则见 openspec/project.md「重要约束」）。
review:
  required_checks:
    - >-
      是否引用并遵循 openspec/specs 基线（当前 v2.1.0）：已存在能力是否在 proposal/specs 中声明为「修改」；
      无基线条目时是否在本次变更中新增/写清规格。
    - >-
      行为变更可追溯：是否对应到 ### Requirement 与 #### Scenario；PR/评审能引用能力名与需求标题。
    - >-
      Android 原生改动（app/android/**）：是否 flutter build apk --release 通过，proguard-rules.pro 已按需更新（见 project.md §Android Release）。

rules:
  tasks:
    - 涉及 app/android/** 或原生 SDK 时，tasks 须含 release 构建与 proguard-rules.pro 更新项（见 openspec/project.md）。
  proposal:
    - 编写前 MUST 阅读 openspec/project.md 与当前 spec 基线。
