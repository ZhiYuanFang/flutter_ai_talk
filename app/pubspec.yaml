name: pangbao_app
description: 胖宝 — 语音/文本驱动的母婴记录客户端
publish_to: "none"
version: 2.0.1+4

fluwx:
  app_id: 'wxe713de83c921f341'
  debug_logging: true
  ios:
    universal_link: https://example.com/pangbao-wechat-ul/

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  webview_flutter: ^4.10.0
  fl_chart: ^0.69.2
  package_info_plus: ^8.1.2
  path_provider: ^2.1.5
  http: ^1.2.2
  shared_preferences: ^2.3.3
  speech_to_text: ^7.0.0
  url_launcher: ^6.3.1
  intl: ">=0.19.0 <0.21.0"
  web_socket_channel: ^3.0.2
  fluwx: ^5.7.5
  sign_in_with_apple: ^7.0.1
  record: ^6.2.0
  image_picker: 1.1.2
  lottie: ^3.1.2
  flutter_secure_storage: ^10.3.1
  image: ^4.9.1
  video_compress: ^3.1.4
  video_player: ^2.9.5
  flutter_staggered_grid_view: ^0.7.0
  photo_manager: ^3.9.0
  permission_handler: ^12.0.3
  crypto: ^3.0.6
  flex_color_picker: ^3.8.0
  markdown_widget: ^2.3.2+8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#B8DFF2"
  adaptive_icon_foreground: assets/images/app_icon.png
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#B8DFF2"
    theme_color: "#B8DFF2"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
