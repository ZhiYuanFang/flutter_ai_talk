# 在 app/ 目录推荐：
#   docker compose --env-file .env.example -f docker-compose.yml up -d --build
# 在仓库根目录若要用「app/」前缀路径，见 README。
services:
  web:
    image: pangbao-web:latest
    container_name: pangbao-web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-}
        WS_HISTORY_URL: ${WS_HISTORY_URL:-}
        BASE_HREF: ${BASE_HREF:-/}
        WEB_HOME_INPUT: ${WEB_HOME_INPUT:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
