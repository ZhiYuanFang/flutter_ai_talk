name: iOS Build Core

on:
  workflow_call:
    inputs:
      target_channel:
        description: 分发目标（adhoc/testflight/appstore）
        required: true
        type: string
      app_dir:
        description: Flutter app 目录
        required: true
        type: string
      flutter_version:
        description: Flutter 版本
        required: true
        type: string
      build_name:
        description: 可选，覆盖 pubspec.yaml 中版本号
        required: false
        default: ''
        type: string
      build_number:
        description: 可选，覆盖 pubspec.yaml 中构建号
        required: false
        default: ''
        type: string
      uses_non_exempt_encryption:
        description: 是否使用非豁免加密
        required: true
        type: boolean
      macos_runner:
        description: macOS Runner 镜像
        required: true
        type: string
      xcode_version:
        description: Xcode 版本
        required: true
        type: string
      internal_testflight_groups:
        description: TestFlight 内部组（可选，逗号分隔）
        required: false
        default: ''
        type: string
      pgyer_update_description:
        description: 蒲公英更新说明（可选）
        required: false
        default: ''
        type: string
      pgyer_install_password:
        description: 蒲公英安装密码（可选）
        required: false
        default: ''
        type: string
    secrets:
      IOS_BUNDLE_ID:
        required: true
      IOS_TEAM_ID:
        required: true
      IOS_CERTIFICATE_P12_BASE64:
        required: true
      IOS_CERTIFICATE_PASSWORD:
        required: true
      IOS_MOBILEPROVISION_APPSTORE_BASE64:
        required: false
      IOS_MOBILEPROVISION_ADHOC_BASE64:
        required: false
      IOS_MOBILEPROVISION_DEVELOPMENT_BASE64:
        required: false
      IOS_MOBILEPROVISION_BASE64:
        required: false
      IOS_APP_DISPLAY_NAME:
        required: false
      IOS_MICROPHONE_USAGE_DESCRIPTION:
        required: false
      IOS_SPEECH_RECOGNITION_USAGE_DESCRIPTION:
        required: false
      WECHAT_APP_ID:
        required: true
      WECHAT_UNIVERSAL_LINK:
        required: true
      IOS_ASSOCIATED_DOMAIN:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_KEY_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_P8_BASE64:
        required: false
      PGYER_API_KEY:
        required: false

jobs:
  build-ios:
    runs-on: ${{ inputs.macos_runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TARGET_CHANNEL: ${{ inputs.target_channel }}
      APP_DIR: ${{ inputs.app_dir }}
      FLUTTER_VERSION: ${{ inputs.flutter_version }}
      BUILD_NAME: ${{ inputs.build_name }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      IOS_USES_NON_EXEMPT_ENCRYPTION: ${{ inputs.uses_non_exempt_encryption }}
      INTERNAL_TESTFLIGHT_GROUPS: ${{ inputs.internal_testflight_groups }}
      PGYER_UPDATE_DESCRIPTION: ${{ inputs.pgyer_update_description }}
      PGYER_INSTALL_PASSWORD: ${{ inputs.pgyer_install_password }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILEPROVISION_APPSTORE_BASE64: ${{ secrets.IOS_MOBILEPROVISION_APPSTORE_BASE64 }}
      IOS_MOBILEPROVISION_ADHOC_BASE64: ${{ secrets.IOS_MOBILEPROVISION_ADHOC_BASE64 }}
      IOS_MOBILEPROVISION_DEVELOPMENT_BASE64: ${{ secrets.IOS_MOBILEPROVISION_DEVELOPMENT_BASE64 }}
      IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
      IOS_APP_DISPLAY_NAME: ${{ secrets.IOS_APP_DISPLAY_NAME }}
      IOS_MICROPHONE_USAGE_DESCRIPTION: ${{ secrets.IOS_MICROPHONE_USAGE_DESCRIPTION }}
      IOS_SPEECH_RECOGNITION_USAGE_DESCRIPTION: ${{ secrets.IOS_SPEECH_RECOGNITION_USAGE_DESCRIPTION }}
      WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
      WECHAT_UNIVERSAL_LINK: ${{ secrets.WECHAT_UNIVERSAL_LINK }}
      IOS_ASSOCIATED_DOMAIN: ${{ secrets.IOS_ASSOCIATED_DOMAIN }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
      PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
      MACOS_RUNNER: ${{ inputs.macos_runner }}
      XCODE_VERSION: ${{ inputs.xcode_version }}
      IOS_DEPLOYMENT_TARGET: '13.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode_version }}

      - name: Print runner environment
        run: |
          set -euo pipefail
          echo "channel: $TARGET_CHANNEL"
          echo "macOS runner: $MACOS_RUNNER"
          sw_vers
          xcodebuild -version
          xcode-select -p
          xcrun --show-sdk-version --sdk iphoneos
          xcrun --show-sdk-path --sdk iphoneos

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Validate workflow configuration
        run: |
          set -euo pipefail

          EFFECTIVE_EXPORT_METHOD=""
          case "$TARGET_CHANNEL" in
            adhoc)
              EFFECTIVE_EXPORT_METHOD="ad-hoc"
              ;;
            testflight|appstore)
              EFFECTIVE_EXPORT_METHOD="app-store"
              ;;
            *)
              echo "::error::未知 target_channel: $TARGET_CHANNEL"
              exit 1
              ;;
          esac

          if [[ ! -f "$APP_DIR/pubspec.yaml" ]]; then
            echo "::error::未找到 $APP_DIR/pubspec.yaml"
            exit 1
          fi

          required=(
            IOS_BUNDLE_ID
            IOS_TEAM_ID
            IOS_CERTIFICATE_P12_BASE64
            IOS_CERTIFICATE_PASSWORD
            WECHAT_APP_ID
            WECHAT_UNIVERSAL_LINK
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::缺少 GitHub Secret: $name"
              exit 1
            fi
          done

          if [[ "$IOS_BUNDLE_ID" == *"_"* ]]; then
            echo "::error::IOS_BUNDLE_ID 不能包含下划线 '_'，请使用合法的 iOS Bundle ID"
            exit 1
          fi

          if [[ "$WECHAT_UNIVERSAL_LINK" == *"*"* ]]; then
            normalized_ul="${WECHAT_UNIVERSAL_LINK%\*}"
            if [[ "$normalized_ul" != "$WECHAT_UNIVERSAL_LINK" && "$normalized_ul" != *"*"* ]]; then
              echo "::warning::检测到 WECHAT_UNIVERSAL_LINK 含末尾 '*'，已自动归一化为: $normalized_ul"
              WECHAT_UNIVERSAL_LINK="$normalized_ul"
            else
              echo "::error::WECHAT_UNIVERSAL_LINK 仅允许末尾可清理的 '*'，请填写微信开放平台登记的完整前缀路径。"
              exit 1
            fi
          fi

          if [[ "$WECHAT_UNIVERSAL_LINK" != https://* ]]; then
            echo "::error::WECHAT_UNIVERSAL_LINK 必须是 https URL（示例：https://www.example.com/wx/ulink/）"
            exit 1
          fi
          echo "WECHAT_UNIVERSAL_LINK=$WECHAT_UNIVERSAL_LINK" >> "$GITHUB_ENV"

          if [[ -z "${IOS_ASSOCIATED_DOMAIN:-}" ]]; then
            IOS_ASSOCIATED_DOMAIN="$(WECHAT_UNIVERSAL_LINK="$WECHAT_UNIVERSAL_LINK" python3 <<'PY'
          from urllib.parse import urlparse
          import os
          import sys

          ul = os.environ['WECHAT_UNIVERSAL_LINK'].strip()
          parsed = urlparse(ul)
          if not parsed.scheme or parsed.scheme != 'https' or not parsed.netloc:
            sys.exit('::error::WECHAT_UNIVERSAL_LINK 不是有效 https URL，无法自动推导 IOS_ASSOCIATED_DOMAIN')
          print(f"applinks:{parsed.netloc}")
          PY
            )"
            echo "::notice::未提供 IOS_ASSOCIATED_DOMAIN，已自动推导为 $IOS_ASSOCIATED_DOMAIN"
          fi

          if [[ "$IOS_ASSOCIATED_DOMAIN" != applinks:* ]]; then
            echo "::error::IOS_ASSOCIATED_DOMAIN 格式错误，应为 applinks:<domain>，例如 applinks:www.pangbao.cuplay.top"
            exit 1
          fi
          echo "IOS_ASSOCIATED_DOMAIN=$IOS_ASSOCIATED_DOMAIN" >> "$GITHUB_ENV"

          WECHAT_UNIVERSAL_LINK="$WECHAT_UNIVERSAL_LINK" IOS_ASSOCIATED_DOMAIN="$IOS_ASSOCIATED_DOMAIN" python3 <<'PY'
          import os
          import sys
          from urllib.parse import urlparse

          ul = os.environ['WECHAT_UNIVERSAL_LINK'].strip()
          associated = os.environ['IOS_ASSOCIATED_DOMAIN'].strip()
          domain = associated[len('applinks:'):].strip()

          parsed = urlparse(ul)
          if not parsed.scheme or parsed.scheme != 'https' or not parsed.netloc:
            sys.exit('::error::WECHAT_UNIVERSAL_LINK 不是有效 https URL')

          if parsed.netloc != domain:
            sys.exit(f"::error::IOS_ASSOCIATED_DOMAIN({domain}) 与 WECHAT_UNIVERSAL_LINK 域名({parsed.netloc}) 不一致")

          if not parsed.path or parsed.path == '/':
            sys.exit('::error::WECHAT_UNIVERSAL_LINK 必须包含微信登记的路径前缀，不能只填域名根路径')
          PY

          selected_profile_secret_name=""
          selected_profile_secret_value=""
          case "$EFFECTIVE_EXPORT_METHOD" in
            app-store)
              selected_profile_secret_name="IOS_MOBILEPROVISION_APPSTORE_BASE64"
              selected_profile_secret_value="${IOS_MOBILEPROVISION_APPSTORE_BASE64:-}"
              ;;
            ad-hoc)
              selected_profile_secret_name="IOS_MOBILEPROVISION_ADHOC_BASE64"
              selected_profile_secret_value="${IOS_MOBILEPROVISION_ADHOC_BASE64:-}"
              ;;
            development)
              selected_profile_secret_name="IOS_MOBILEPROVISION_DEVELOPMENT_BASE64"
              selected_profile_secret_value="${IOS_MOBILEPROVISION_DEVELOPMENT_BASE64:-}"
              ;;
          esac

          if [[ -z "$selected_profile_secret_value" ]]; then
            if [[ -n "${IOS_MOBILEPROVISION_BASE64:-}" ]]; then
              echo "::warning::未配置 $selected_profile_secret_name，已回退到 IOS_MOBILEPROVISION_BASE64（兼容旧配置）。"
            else
              echo "::error::缺少描述文件 Secret：$selected_profile_secret_name（或兼容回退 IOS_MOBILEPROVISION_BASE64）"
              exit 1
            fi
          fi

          if [[ "$TARGET_CHANNEL" == "adhoc" ]]; then
            if [[ -z "${PGYER_API_KEY:-}" ]]; then
              echo "::error::ad-hoc 分发缺少 Secret: PGYER_API_KEY"
              exit 1
            fi
          fi

          if [[ "$TARGET_CHANNEL" == "testflight" || "$TARGET_CHANNEL" == "appstore" ]]; then
            upload_required=(
              APP_STORE_CONNECT_ISSUER_ID
              APP_STORE_CONNECT_KEY_ID
              APP_STORE_CONNECT_API_KEY_P8_BASE64
            )
            for name in "${upload_required[@]}"; do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::${TARGET_CHANNEL} 上传缺少 GitHub Secret: $name"
                exit 1
              fi
            done
          fi

          if [[ -n "${PGYER_INSTALL_PASSWORD:-}" && "$TARGET_CHANNEL" != "adhoc" ]]; then
            echo "::warning::仅 ad-hoc 使用 pgyer_install_password，当前 channel=$TARGET_CHANNEL 将忽略该参数。"
          fi

          echo "EFFECTIVE_EXPORT_METHOD=$EFFECTIVE_EXPORT_METHOD" >> "$GITHUB_ENV"
          echo "[Mode] target_channel=$TARGET_CHANNEL export_method=$EFFECTIVE_EXPORT_METHOD"
          if [[ -n "$INTERNAL_TESTFLIGHT_GROUPS" ]]; then
            echo "[Mode] internal_testflight_groups=$INTERNAL_TESTFLIGHT_GROUPS"
          fi

      - name: Generate iOS project if missing
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          if [[ ! -d ios/Runner.xcodeproj ]]; then
            org="${IOS_BUNDLE_ID%.*}"
            if [[ -z "$org" || "$org" == "$IOS_BUNDLE_ID" ]]; then
              echo "::error::无法从 IOS_BUNDLE_ID 推导 flutter create 所需的组织名"
              exit 1
            fi
            flutter create . --platforms=ios --org "$org"
          fi

      - name: Prepare iOS project metadata
        working-directory: ${{ env.APP_DIR }}
        run: bash tool/ci/prepare_ios_project.sh

      - name: Install Flutter dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: ${{ env.APP_DIR }}
        run: dart run flutter_launcher_icons

      - name: Validate iOS icon parity
        working-directory: ${{ env.APP_DIR }}
        run: bash tool/ci/check_ios_icon_parity.sh

      - name: Install CocoaPods dependencies
        working-directory: ${{ env.APP_DIR }}/ios
        run: pod install --repo-update

      - name: Import signing certificate and provisioning profile
        run: |
          set -euo pipefail

          SELECTED_MOBILEPROVISION_BASE64=""
          case "$EFFECTIVE_EXPORT_METHOD" in
            app-store)
              SELECTED_MOBILEPROVISION_BASE64="${IOS_MOBILEPROVISION_APPSTORE_BASE64:-}"
              ;;
            ad-hoc)
              SELECTED_MOBILEPROVISION_BASE64="${IOS_MOBILEPROVISION_ADHOC_BASE64:-}"
              ;;
            development)
              SELECTED_MOBILEPROVISION_BASE64="${IOS_MOBILEPROVISION_DEVELOPMENT_BASE64:-}"
              ;;
          esac

          if [[ -z "$SELECTED_MOBILEPROVISION_BASE64" ]]; then
            SELECTED_MOBILEPROVISION_BASE64="${IOS_MOBILEPROVISION_BASE64:-}"
          fi

          if [[ -z "$SELECTED_MOBILEPROVISION_BASE64" ]]; then
            echo "::error::未找到可用的描述文件 Secret，请配置与导出方式匹配的三套 Secret。"
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/signing_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          CERT_PATH="$CERT_PATH" PROFILE_PATH="$PROFILE_PATH" SELECTED_MOBILEPROVISION_BASE64="$SELECTED_MOBILEPROVISION_BASE64" python3 <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ['CERT_PATH']).write_bytes(base64.b64decode(os.environ['IOS_CERTIFICATE_P12_BASE64']))
          Path(os.environ['PROFILE_PATH']).write_bytes(base64.b64decode(os.environ['SELECTED_MOBILEPROVISION_BASE64']))
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")

          PROFILE_HAS_DEVICES="false"
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices:0' "$PROFILE_PLIST" >/dev/null 2>&1; then
            PROFILE_HAS_DEVICES="true"
          fi

          PROFILE_GET_TASK_ALLOW="false"
          if /usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST" >/dev/null 2>&1; then
            PROFILE_GET_TASK_ALLOW="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST")"
          fi

          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_HAS_DEVICES=$PROFILE_HAS_DEVICES" >> "$GITHUB_ENV"
          echo "PROFILE_GET_TASK_ALLOW=$PROFILE_GET_TASK_ALLOW" >> "$GITHUB_ENV"

      - name: Validate provisioning profile compatibility
        run: |
          set -euo pipefail

          echo "[Profile] name=$PROFILE_NAME has_devices=$PROFILE_HAS_DEVICES get-task-allow=$PROFILE_GET_TASK_ALLOW"
          case "$EFFECTIVE_EXPORT_METHOD" in
            app-store)
              if [[ "$PROFILE_HAS_DEVICES" == "true" ]]; then
                echo "::error::当前为 app-store 导出，但描述文件包含 ProvisionedDevices，疑似 development/ad-hoc 描述文件。"
                exit 1
              fi
              ;;
            ad-hoc)
              if [[ "$PROFILE_HAS_DEVICES" != "true" ]]; then
                echo "::error::当前为 ad-hoc 导出，但描述文件不包含 ProvisionedDevices，疑似 app-store 描述文件。"
                exit 1
              fi
              if [[ "$PROFILE_GET_TASK_ALLOW" == "true" ]]; then
                echo "::error::当前为 ad-hoc 导出，但描述文件为 development（get-task-allow=true）。请改用 Ad Hoc 描述文件。"
                exit 1
              fi
              ;;
            development)
              if [[ "$PROFILE_HAS_DEVICES" != "true" || "$PROFILE_GET_TASK_ALLOW" != "true" ]]; then
                echo "::error::当前为 development 导出，但描述文件不是 iOS App Development。"
                exit 1
              fi
              ;;
          esac

      - name: Configure Xcode signing
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          export EXPORT_METHOD="$EFFECTIVE_EXPORT_METHOD"
          sudo gem install xcodeproj -N
          ruby tool/ci/configure_ios_project.rb

      - name: Create export options plist
        run: |
          set -euo pipefail

          SIGNING_CERTIFICATE="Apple Distribution"
          if [[ "$EFFECTIVE_EXPORT_METHOD" == "development" ]]; then
            SIGNING_CERTIFICATE="Apple Development"
          fi

          EXPORT_DESTINATION="export"
          EXPORT_METHOD_PLIST="$EFFECTIVE_EXPORT_METHOD"
          if [[ "$EFFECTIVE_EXPORT_METHOD" == "ad-hoc" ]]; then
            EXPORT_METHOD_PLIST="release-testing"
          fi

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>$EXPORT_DESTINATION</string>
            <key>method</key>
            <string>$EXPORT_METHOD_PLIST</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>$SIGNING_CERTIFICATE</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$IOS_BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          echo "EXPORT_DESTINATION=$EXPORT_DESTINATION" >> "$GITHUB_ENV"
          echo "EXPORT_OPTIONS_PLIST=$RUNNER_TEMP/ExportOptions.plist" >> "$GITHUB_ENV"

      - name: Build signed IPA
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          echo "[Build] target_channel=$TARGET_CHANNEL export_method=$EFFECTIVE_EXPORT_METHOD"

          EFFECTIVE_BUILD_NUMBER="$BUILD_NUMBER"
          if [[ -z "$EFFECTIVE_BUILD_NUMBER" ]]; then
            EFFECTIVE_BUILD_NUMBER="$(date +"%Y%m%d%H%M")"
            echo "::notice::未提供 build_number，自动使用时间构建号: $EFFECTIVE_BUILD_NUMBER"
          fi

          args=(flutter build ipa --release --export-options-plist "$EXPORT_OPTIONS_PLIST")
          args+=("--dart-define=WECHAT_APP_ID=$WECHAT_APP_ID")
          args+=("--dart-define=WECHAT_UNIVERSAL_LINK=$WECHAT_UNIVERSAL_LINK")
          if [[ -n "$BUILD_NAME" ]]; then
            args+=(--build-name "$BUILD_NAME")
          fi
          args+=(--build-number "$EFFECTIVE_BUILD_NUMBER")
          "${args[@]}"

      - name: Resolve IPA path (with export fallback)
        run: |
          set -euo pipefail

          IPA_PATH="$(find "$APP_DIR/build/ios/ipa" -maxdepth 2 -name '*.ipa' | head -n 1 || true)"

          if [[ -z "$IPA_PATH" ]]; then
            echo "::warning::未在 $APP_DIR/build/ios/ipa 找到 IPA，尝试从 xcarchive 兜底导出。"
            ARCHIVE_PATH="$(find "$APP_DIR/build/ios/archive" -maxdepth 1 -name '*.xcarchive' | head -n 1 || true)"
            if [[ -n "$ARCHIVE_PATH" ]]; then
              mkdir -p "$APP_DIR/build/ios/ipa"
              xcodebuild -exportArchive \
                -archivePath "$ARCHIVE_PATH" \
                -exportPath "$APP_DIR/build/ios/ipa" \
                -exportOptionsPlist "$EXPORT_OPTIONS_PLIST"
              IPA_PATH="$(find "$APP_DIR/build/ios/ipa" -maxdepth 2 -name '*.ipa' | head -n 1 || true)"
            fi
          fi

          if [[ -z "$IPA_PATH" ]]; then
            echo "::error::未找到 IPA 文件。"
            echo "--- debug list: $APP_DIR/build/ios ---"
            find "$APP_DIR/build/ios" -maxdepth 4 -print || true
            exit 1
          fi

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "[IPA] resolved path: $IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ inputs.target_channel }}
          if-no-files-found: error
          path: ${{ env.IPA_PATH }}

      - name: Upload xcarchive artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcarchive-${{ inputs.target_channel }}
          if-no-files-found: error
          path: ${{ env.APP_DIR }}/build/ios/archive/*.xcarchive

      - name: Upload to Pgyer
        if: ${{ inputs.target_channel == 'adhoc' }}
        run: |
          set -euo pipefail

          IPA_PATH="${IPA_PATH:-}"
          if [[ -z "$IPA_PATH" ]]; then
            echo "::error::未找到待上传的 IPA"
            exit 1
          fi

          install_type="1"
          if [[ -n "${PGYER_INSTALL_PASSWORD:-}" ]]; then
            install_type="2"
          fi

          update_desc="${PGYER_UPDATE_DESCRIPTION:-}"
          if [[ -z "$update_desc" ]]; then
            update_desc="GitHub Actions ad-hoc 自动上传"
          fi

          response_path="$RUNNER_TEMP/pgyer_upload_response.json"
          if [[ -n "${PGYER_INSTALL_PASSWORD:-}" ]]; then
            http_code="$(curl -sS -o "$response_path" -w "%{http_code}" \
              -F "_api_key=$PGYER_API_KEY" \
              -F "file=@$IPA_PATH" \
              -F "buildInstallType=$install_type" \
              -F "buildUpdateDescription=$update_desc" \
              -F "buildPassword=$PGYER_INSTALL_PASSWORD" \
              https://www.pgyer.com/apiv2/app/upload)"
          else
            http_code="$(curl -sS -o "$response_path" -w "%{http_code}" \
              -F "_api_key=$PGYER_API_KEY" \
              -F "file=@$IPA_PATH" \
              -F "buildInstallType=$install_type" \
              -F "buildUpdateDescription=$update_desc" \
              https://www.pgyer.com/apiv2/app/upload)"
          fi

          if [[ "$http_code" != "200" ]]; then
            echo "::error::蒲公英上传 HTTP 异常，status=$http_code"
            cat "$response_path" || true
            exit 1
          fi

          RESPONSE_PATH="$response_path" python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          path = Path(os.environ['RESPONSE_PATH'])
          text = path.read_text(encoding='utf-8', errors='replace')
          try:
              payload = json.loads(text)
          except Exception:
              sys.exit(f"::error::蒲公英返回非 JSON 响应: {text[:500]}")

          code = payload.get('code')
          message = payload.get('message') or payload.get('msg') or 'unknown'
          data = payload.get('data') or {}

          if code not in (0, '0'):
              detail = data.get('error') or data.get('message') or ''
              sys.exit(f"::error::蒲公英上传失败 code={code} message={message} detail={detail}")

          build_key = data.get('buildKey', '')
          build_version = data.get('buildVersion', '')
          build_version_no = data.get('buildVersionNo', '')
          print(f"::notice::蒲公英上传成功 buildKey={build_key} buildVersion={build_version} buildVersionNo={build_version_no}")
          PY

      - name: Prepare App Store Connect API key
        if: ${{ inputs.target_channel == 'testflight' || inputs.target_channel == 'appstore' }}
        run: |
          set -euo pipefail

          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          API_KEY_JSON_PATH="$RUNNER_TEMP/app_store_connect_api_key.json"
          mkdir -p "$HOME/.appstoreconnect/private_keys"

          KEY_PATH="$KEY_PATH" python3 <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ['KEY_PATH']).write_bytes(base64.b64decode(os.environ['APP_STORE_CONNECT_API_KEY_P8_BASE64']))
          PY

          chmod 600 "$KEY_PATH"

          KEY_PATH="$KEY_PATH" API_KEY_JSON_PATH="$API_KEY_JSON_PATH" APP_STORE_CONNECT_KEY_ID="$APP_STORE_CONNECT_KEY_ID" APP_STORE_CONNECT_ISSUER_ID="$APP_STORE_CONNECT_ISSUER_ID" python3 <<'PY'
          import json
          import os
          from pathlib import Path

          key = Path(os.environ['KEY_PATH']).read_text(encoding='utf-8')
          payload = {
            'key_id': os.environ['APP_STORE_CONNECT_KEY_ID'],
            'issuer_id': os.environ['APP_STORE_CONNECT_ISSUER_ID'],
            'key': key,
            'in_house': False,
          }
          Path(os.environ['API_KEY_JSON_PATH']).write_text(json.dumps(payload), encoding='utf-8')
          PY

          echo "APP_STORE_CONNECT_API_KEY_JSON=$API_KEY_JSON_PATH" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        if: ${{ inputs.target_channel == 'testflight' }}
        run: |
          set -euo pipefail

          if ! command -v fastlane >/dev/null 2>&1; then
            sudo gem install fastlane -N
          fi

          IPA_PATH="${IPA_PATH:-}"
          if [[ -z "$IPA_PATH" ]]; then
            echo "::error::未找到待上传的 IPA"
            exit 1
          fi

          upload_cmd=(
            fastlane pilot upload
            --ipa "$IPA_PATH"
            --api_key_path "$APP_STORE_CONNECT_API_KEY_JSON"
            --verbose
          )

          if [[ -n "$INTERNAL_TESTFLIGHT_GROUPS" ]]; then
            echo "[TestFlight] target_groups=$INTERNAL_TESTFLIGHT_GROUPS"

            max_retries=3
            retry_delay_seconds=120
            attempt=1
            distributed=false

            while [[ "$attempt" -le "$max_retries" ]]; do
              echo "[TestFlight] internal distribution attempt ${attempt}/${max_retries}"
              if "${upload_cmd[@]}" --groups "$INTERNAL_TESTFLIGHT_GROUPS" --skip_submission true; then
                distributed=true
                echo "[TestFlight] upload+internal distribution success"
                break
              fi

              if [[ "$attempt" -lt "$max_retries" ]]; then
                echo "::warning::第 ${attempt} 次内部分发失败，${retry_delay_seconds}s 后重试。"
                sleep "$retry_delay_seconds"
              fi
              attempt=$((attempt + 1))
            done

            if [[ "$distributed" != "true" ]]; then
              echo "::warning::已完成 IPA 上传，但自动分配内部测试组失败。"
              echo "::warning::请在 App Store Connect -> TestFlight 中手工将该构建分配到组：$INTERNAL_TESTFLIGHT_GROUPS"
            fi
          else
            echo "::notice::未配置 internal_testflight_groups，本次仅上传 TestFlight，不自动分配测试组。"
            "${upload_cmd[@]}" --skip_waiting_for_build_processing true
          fi

      - name: Upload to App Store Connect (upload only)
        if: ${{ inputs.target_channel == 'appstore' }}
        run: |
          set -euo pipefail

          if ! command -v fastlane >/dev/null 2>&1; then
            sudo gem install fastlane -N
          fi

          IPA_PATH="${IPA_PATH:-}"
          if [[ -z "$IPA_PATH" ]]; then
            echo "::error::未找到待上传的 IPA"
            exit 1
          fi

          echo "[ASC] upload-only path (no submit, no release)"
          fastlane pilot upload \
            --ipa "$IPA_PATH" \
            --api_key_path "$APP_STORE_CONNECT_API_KEY_JSON" \
            --skip_waiting_for_build_processing true \
            --skip_submission true \
            --verbose
